# =====================================================================
# 巡维云 EquipCare · 前端 Nginx 配置
# 静态资源本机托管，/api 反向代理到 backend 容器。
# =====================================================================

upstream equipcare_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 与后端 multipart 上限（10MB 单文件 / 20MB 单请求）对齐
    client_max_body_size 20m;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hash 路由单页应用：入口不走 history 回退，但防止 404 直接落空
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存，保证发版后浏览器立即拿到新版
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 带 hash 的静态资源可长缓存
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # SSE 实时推送长连接（必须先于 /api/ 匹配，且关闭缓冲：
    # proxy_buffering off 保证事件即时到达客户端；读超时要大于服务端
    # 连接最大生命周期 30 分钟，让服务端主动断开而非代理层误杀）
    location /api/sse/ {
        proxy_pass http://equipcare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 35m;
        proxy_send_timeout 35m;
    }

    # API 反向代理（后端统一以 /api 前缀发布）
    location /api/ {
        proxy_pass http://equipcare_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout;
    }

    # 健康检查端点直接代理
    location = /actuator/health {
        proxy_pass http://equipcare_backend;
        access_log off;
    }
}
