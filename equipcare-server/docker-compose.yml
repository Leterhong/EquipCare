# =====================================================================
# 巡维云 EquipCare · Docker Compose 编排
#
# 首次启动：
#   1. cp deploy/env.example .env 并填写强密码（.env 不入库，已在 .gitignore）
#   2. docker compose up -d --build
#   3. 首次部署开启管理员引导：.env 中 EQUIPCARE_BOOTSTRAP_ENABLED=true，
#      创建成功后立即改回 false 并 `docker compose up -d` 使其失效
#
# 日常运维见 docs/07-部署操作文档.md。
# =====================================================================

name: equipcare

services:
  mysql:
    image: mysql:8.4
    container_name: equipcare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 root 强密码}
      EQUIPCARE_APP_PASSWORD: ${EQUIPCARE_APP_PASSWORD:?请在 .env 设置应用账号强密码}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max_connections=200
    volumes:
      # 数据持久化：删容器不丢数据；备份方案见 deploy/backup.sh
      - mysql-data:/var/lib/mysql
      # 全量建表 / 演示数据来源（只读挂载）
      - ./database:/sql-src:ro
      # 首次初始化脚本（建库 + 建应用账号 + schema + seed）
      - ./deploy/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [equipcare]
    # 安全默认：不向宿主机暴露数据库端口。确需远程管理时再放开并绑定 127.0.0.1
    # ports: ["127.0.0.1:3306:3306"]

  redis:
    image: redis:7-alpine
    container_name: equipcare-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 设置 Redis 强密码}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [equipcare]

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: equipcare/backend:latest
    container_name: equipcare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 生产 profile：关闭 SQL 打印与 Swagger，启用敏感配置强校验（application-prod.yml）
      SPRING_PROFILES_ACTIVE: prod
      # ---- 数据库（应用账号，非 root）----
      EQUIPCARE_DB_HOST: mysql
      EQUIPCARE_DB_PORT: "3306"
      EQUIPCARE_DB_NAME: equipcare
      EQUIPCARE_DB_USER: equipcare_app
      EQUIPCARE_DB_PASSWORD: ${EQUIPCARE_APP_PASSWORD}
      # ---- Redis ----
      EQUIPCARE_REDIS_HOST: redis
      EQUIPCARE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ---- JWT（>=32 字节，必须更换）----
      EQUIPCARE_JWT_SECRET: ${EQUIPCARE_JWT_SECRET:?请在 .env 设置至少 32 字节的 JWT 密钥}
      # ---- 文件上传（持久化目录）----
      EQUIPCARE_UPLOAD_DIR: /data/uploads
      # ---- 扫码落地页基址：生产必须为对外可达地址 ----
      EQUIPCARE_SCAN_BASE_URL: ${EQUIPCARE_SCAN_BASE_URL:-}
      # ---- 管理员引导（仅首次部署开启一次）----
      EQUIPCARE_BOOTSTRAP_ENABLED: ${EQUIPCARE_BOOTSTRAP_ENABLED:-false}
      EQUIPCARE_BOOTSTRAP_USERNAME: ${EQUIPCARE_BOOTSTRAP_USERNAME:-}
      EQUIPCARE_BOOTSTRAP_PASSWORD: ${EQUIPCARE_BOOTSTRAP_PASSWORD:-}
      EQUIPCARE_BOOTSTRAP_REAL_NAME: ${EQUIPCARE_BOOTSTRAP_REAL_NAME:-系统管理员}
    volumes:
      # 上传文件持久化：设备照片 / 维修凭证
      - upload-data:/data/uploads
      # 应用日志落盘（同时可用 docker compose logs -f backend 查看）
      - ./logs/backend:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [equipcare]
    # 调试期可放开：仅绑定本机回环
    # ports: ["127.0.0.1:8080:8080"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: equipcare/frontend:latest
    container_name: equipcare-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
    ports:
      # 对外唯一入口：http://<服务器IP>:80
      - "${FRONTEND_PORT:-80}:80"
    networks: [equipcare]

volumes:
  mysql-data:
  redis-data:
  upload-data:

networks:
  equipcare:
    driver: bridge
