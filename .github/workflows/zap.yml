name: Security Scan (ZAP)

# OWASP ZAP 基线扫描：每周一凌晨 + 手动触发。
# 当前为未认证基线扫描（暴露面/响应头/错误处理），认证态深度扫描为后续计划。
# 非阻塞（continue-on-error）：报告仅作安全信号，产物在 Actions Artifacts。
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: mvn -B package -DskipTests --file equipcare-server/pom.xml

      - name: Start MySQL & Redis
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=ci_root_pw -e MYSQL_DATABASE=equipcare \
            mysql:8.4
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_pw --silent && break
            sleep 2
          done

      - name: Apply schema & base data
        run: |
          docker exec -i mysql mysql -uroot -pci_root_pw --default-character-set=utf8mb4 equipcare \
            < equipcare-server/database/schema.sql
          docker exec -i mysql mysql -uroot -pci_root_pw --default-character-set=utf8mb4 equipcare \
            < equipcare-server/database/seed.sql

      - name: Start application
        run: |
          java -jar equipcare-server/equipcare-admin/target/equipcare-server.jar \
            --server.port=8080 \
            --spring.data.redis.host=127.0.0.1 \
            --spring.datasource.username=root \
            --spring.datasource.password=ci_root_pw \
            --equipcare.bootstrap.enabled=true \
            --equipcare.bootstrap.username=scanadmin \
            --equipcare.bootstrap.password='ZapScan_2026!' \
            --equipcare.bootstrap.real-name=扫描员 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/actuator/health && break
            sleep 3
          done
          curl -sf http://127.0.0.1:8080/actuator/health

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://127.0.0.1:8080'
          allow_rule_ids: ''
          cmd_options: '-I -a'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_md.md
