name: E2E (Playwright)

# Vue 端关键路径端到端：登录 → 驾驶舱 → 设备台账 → 消息中心
# 依赖 MySQL/Redis 服务容器 + bootstrap 管理员
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: equipcare-web/package-lock.json }

      - name: Package backend
        run: mvn -B package -DskipTests --file equipcare-server/pom.xml

      - name: Start MySQL & Redis
        run: |
          docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=ci_root_pw -e MYSQL_DATABASE=equipcare mysql:8.4
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec mysql mysqladmin ping -h127.0.0.1 -uroot -pci_root_pw --silent && break; sleep 2; done

      - name: Apply schema & seed
        run: |
          docker exec -i mysql mysql -uroot -pci_root_pw --default-character-set=utf8mb4 equipcare < equipcare-server/database/schema.sql
          docker exec -i mysql mysql -uroot -pci_root_pw --default-character-set=utf8mb4 equipcare < equipcare-server/database/seed.sql

      - name: Start backend & bootstrap admin
        run: |
          java -jar equipcare-server/equipcare-admin/target/equipcare-server.jar             --spring.datasource.username=root --spring.datasource.password=ci_root_pw             --equipcare.bootstrap.enabled=true --equipcare.bootstrap.username=e2eadmin             --equipcare.bootstrap.password='E2eAdmin_2026!' --equipcare.bootstrap.real-name=E2E &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8080/actuator/health && break; sleep 3; done
          curl -sf http://127.0.0.1:8080/actuator/health

      - name: Prepare multi-tenant data (acme 租户 + 隔离样本)
        run: |
          docker exec -i mysql mysql -uroot -pci_root_pw --default-character-set=utf8mb4 equipcare <<'SQL'
          SET SQL_MODE='NO_AUTO_VALUE_ON_ZERO';
          INSERT IGNORE INTO sys_tenant (id, tenant_code, tenant_name, plan, status) VALUES (1, 'acme', 'ACME 制造', 'STANDARD', 1);
          UPDATE sys_user SET tenant_id = 1 WHERE username = 'acmeadmin';
          INSERT INTO eq_equipment (asset_no, equipment_name, category_id, status, tenant_id, version, deleted)
          SELECT 'ACME-EQ-001', 'ACME 专属设备', c.id, 'IN_USE', 1, 0, 0
            FROM (SELECT id FROM eq_category LIMIT 1) c
           WHERE NOT EXISTS (SELECT 1 FROM eq_equipment WHERE asset_no = 'ACME-EQ-001');
          SQL

      - name: Install Vue deps & Playwright
        working-directory: equipcare-web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: equipcare-web
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_USERNAME: e2eadmin
          E2E_PASSWORD: 'E2eAdmin_2026!'
        run: |
          npx vite --port 5173 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:5173 && break; sleep 1; done
          npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: equipcare-web/playwright-report/
