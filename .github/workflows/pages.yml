name: Pages

# 项目展示站（website/）→ GitHub Pages
# 上线地址：https://leterhong.github.io/EquipCare/
#
# 【当前停用】私有仓库在免费计划下不支持 Pages，自动部署会失败。
# 恢复步骤（仓库转 Public 后）：
#   1. 把下方 on: 段恢复为 push 触发（取消注释）
#   2. Settings → Pages → Source 选 "GitHub Actions"
#   3. Actions → Pages → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，取消排队中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
