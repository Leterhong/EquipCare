name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend · Maven build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build & unit tests (含 ArchUnit 架构守护)
        run: mvn -B test --file equipcare-server/pom.xml
      - name: Package (fat jar)
        run: mvn -B package -DskipTests --file equipcare-server/pom.xml

  frontend:
    name: Frontend · Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: equipcare-server/frontend-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: equipcare-server/frontend-tests/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npx vitest run
