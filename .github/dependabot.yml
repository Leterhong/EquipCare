# 依赖漏洞与版本更新监控
# Maven 依赖每周检查；npm（前端测试工具链 + Vue 工程）每两周检查
version: 2
updates:
  - package-ecosystem: maven
    directory: "equipcare-server/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
  - package-ecosystem: npm
    directory: "equipcare-server/frontend-tests/"
    schedule:
      interval: biweekly
    labels: [dependencies, frontend]
  - package-ecosystem: npm
    directory: "equipcare-web/"
    schedule:
      interval: biweekly
    labels: [dependencies, frontend]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: [dependencies, ci]
